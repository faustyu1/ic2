# Builds the mod and publishes it to Modrinth when a release tag v<mod_version> is pushed, then
# submits the Modrinth project for review while it is still a draft.
#
# Needs the repository secret MODRINTH_TOKEN (scopes: create versions, write projects).
name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches mod_version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match mod_version ${version}" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and upload to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew build publishModrinth

      - name: Submit the Modrinth project for review
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          project=$(sed -n 's/^modrinth_project_id=//p' gradle.properties)
          api="https://api.modrinth.com/v2/project/${project}"
          status=$(curl -fsS -H "Authorization: ${MODRINTH_TOKEN}" "${api}" | jq -r .status)
          echo "project status: ${status}"
          if [ "${status}" = "draft" ]; then
            curl -fsS -X PATCH -H "Authorization: ${MODRINTH_TOKEN}" -H "Content-Type: application/json" \
              -d '{"status":"processing"}' "${api}"
            echo "submitted for review"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ic2-community-edition
          path: build/libs/*.jar
