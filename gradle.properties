# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric (target: Minecraft 1.21.1)
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.19.3
fabric_version=0.116.15+1.21.1

# Mod
# SemVer: MAJOR.MINOR.PATCH with an optional -alpha.N / -beta.N / -rc.N pre-release. The jar and
# fabric.mod.json get "+mc<minecraft_version>" appended; releases are tagged v<mod_version>.
mod_version=0.1.0-alpha.1
maven_group=ic2
archives_base_name=ic2-community-edition

# Optional integrations
rei_version=16.0.799
modmenu_version=11.0.3
cloth_config_version=15.0.130

# Release targets (filled in once the projects exist)
modrinth_project_id=Z2mS1bx5
curseforge_project_id=
