plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

if (!(project.mod_version ==~ /\d+\.\d+\.\d+(-(alpha|beta|rc)\.\d+)?/)) {
    throw new GradleException("mod_version '${project.mod_version}' is not MAJOR.MINOR.PATCH[-alpha.N|-beta.N|-rc.N]")
}
// the part after + is SemVer build metadata: Fabric ignores it when comparing versions, so one mod
// version built for several Minecraft versions still compares equal
version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    // opens the biome climate the crops read their humidity bonus from (see ic2.accesswidener)
    accessWidenerPath = file("src/main/resources/ic2.accesswidener")

    mixin {
        // remap the mixin annotations at remapJar time instead of generating a refmap with the
        // annotation processor, so ic2.mixins.json needs no refmap entry
        useLegacyMixinAp = false
    }
}

repositories {
    // Third-party libraries (e.g. EJML for the nuclear reactor / crop math)
    // will be added here during the port.
    mavenCentral()
    // Roughly Enough Items and its libraries (cloth-config, architectury)
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.architectury.dev/" }
    // Mod Menu
    maven { url "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // EJML (the energy grid's and the wind simulation's linear algebra). 1.12.2 shaded EJML 0.26
    // into ic2.shades; the port uses 0.43 from Maven Central and ships it inside the mod jar
    // (jar-in-jar): `implementation` alone only puts it on the development classpath, and a real
    // installation then fails with NoClassDefFoundError. include is not transitive, so every
    // module of ejml-all is listed.
    implementation 'org.ejml:ejml-all:0.43'
    ['core', 'ddense', 'fdense', 'cdense', 'zdense', 'dsparse', 'fsparse', 'simple'].each {
        include "org.ejml:ejml-${it}:0.43"
    }

    // REI is optional: compiled against its API, present only in the dev client
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${project.rei_version}"
    modLocalRuntime "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"

    // Mod Menu and Cloth Config are optional too: with both, Mod Menu's config button opens the
    // settings screen; without them the settings are edited in config/IC2.ini
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    modLocalRuntime "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// The release notes of mod_version: its "## [<mod_version>]" section of CHANGELOG.md
def releaseNotes = providers.provider {
    def lines = file("CHANGELOG.md").readLines()
    def start = lines.findIndexOf { it.startsWith("## [${project.mod_version}]") }
    if (start < 0) {
        throw new GradleException("CHANGELOG.md has no section for ${project.mod_version}")
    }
    def end = lines.findIndexOf(start + 1) { it.startsWith("## [") }
    lines.subList(start + 1, end < 0 ? lines.size() : end).join("\n").trim()
}

// Release uploads (./gradlew publishModrinth / publishCurseforge / publishMods). Tokens come from the
// environment and are never committed; -PdryRun builds and checks everything without uploading.
publishMods {
    file = remapJar.archiveFile
    additionalFiles.from(remapSourcesJar.archiveFile)
    displayName = "IC2 Community Edition ${project.mod_version} (Fabric ${project.minecraft_version})"
    version = project.version
    changelog = releaseNotes
    // the release channel follows the pre-release label: -alpha -> alpha, -beta / -rc -> beta
    type = project.mod_version.contains("-alpha") ? ALPHA
            : project.mod_version ==~ /.*-(beta|rc)\..*/ ? BETA : STABLE
    modLoaders.add("fabric")
    dryRun = providers.gradleProperty("dryRun").isPresent()

    modrinth {
        projectId = project.modrinth_project_id
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(project.minecraft_version)
        requires("fabric-api")
        optional("rei")
    }
    curseforge {
        projectId = project.curseforge_project_id
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(project.minecraft_version)
        javaVersions.add(JavaVersion.VERSION_21)
        client = true
        server = true
        requires("fabric-api")
        optional("roughly-enough-items")
    }
}
